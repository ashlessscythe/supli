services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: supli
      POSTGRES_PASSWORD: supli
      POSTGRES_DB: supli_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supli -d supli_test"]
      interval: 2s
      timeout: 5s
      retries: 10
