<!DOCTYPE html>
<html lang="en" data-theme="cyberpunk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, initial-scale=1" />
  <title>Supplies — Era 05 Cyberpunk Current</title>
  <style>
    :root {
      --background: 260 30% 6%;
      --foreground: 180 100% 90%;
      --card: 260 25% 10%;
      --card-foreground: 180 100% 90%;
      --primary: 300 100% 60%;
      --primary-foreground: 260 30% 6%;
      --secondary: 260 20% 16%;
      --secondary-foreground: 180 80% 85%;
      --muted: 260 15% 18%;
      --muted-foreground: 180 30% 65%;
      --accent: 180 100% 50%;
      --accent-foreground: 260 30% 6%;
      --destructive: 0 90% 55%;
      --border: 280 40% 25%;
      --input: 280 40% 25%;
      --ring: 300 100% 60%;
      --radius: 0.75rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
      color: hsl(var(--foreground));
      background: hsl(var(--background));
      letter-spacing: 0.01em;
      min-height: 100vh;
    }
    .era-label {
      background: hsl(var(--muted));
      color: hsl(var(--muted-foreground));
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      padding: 5px 32px;
      border-bottom: 1px solid hsl(var(--border));
    }
    .page-wrap {
      padding: 24px 32px 32px;
      max-width: 1440px;
    }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .page-header h2 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: hsl(var(--foreground));
      text-shadow: 0 0 20px hsl(var(--primary) / 0.25);
    }
    .btn-add {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border: 1px solid hsl(var(--primary));
      border-radius: calc(var(--radius) - 2px);
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 12px hsl(var(--primary) / 0.35);
    }
    #summary { display: none; }
    .table-shell {
      border-radius: calc(var(--radius) - 2px);
      border: 1px solid hsl(var(--border));
      background: hsl(var(--card));
      box-shadow: 0 0 12px rgb(255 0 255 / 0.08);
      overflow: hidden;
    }
    #toolbar {
      padding: 16px 0 0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .search-input, .stock-filter {
      font-family: inherit;
      font-size: 14px;
      padding: 8px 12px;
      border: 1px solid hsl(var(--input));
      border-radius: calc(var(--radius) - 4px);
      background: hsl(var(--background));
      color: hsl(var(--foreground));
    }
    .search-input {
      width: 320px;
      box-shadow: 0 0 0 0 transparent;
    }
    .search-input:focus {
      outline: none;
      box-shadow: 0 0 0 2px hsl(var(--ring) / 0.4);
    }
    .stock-filter { width: 180px; cursor: pointer; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-top: 1px solid hsl(var(--border));
    }
    thead th {
      border-top: none;
      font-size: 13px;
      font-weight: 500;
      color: hsl(var(--muted-foreground));
      background: hsl(var(--card));
    }
    .sort-btn {
      background: none;
      border: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .sort-btn:hover { color: hsl(var(--foreground)); }
    .sort-active { color: hsl(var(--foreground)); }
    .cell-name {
      font-weight: 500;
      color: hsl(var(--foreground));
    }
    .cell-desc {
      color: hsl(var(--muted-foreground));
      max-width: 300px;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: hsl(var(--muted-foreground));
    }
    .cell-qty, .cell-threshold { text-align: right; }
    .qty-low {
      color: hsl(var(--destructive));
      font-weight: 600;
    }
    tbody tr {
      cursor: pointer;
      transition: background 0.15s;
    }
    tbody tr:hover {
      background: hsl(var(--accent) / 0.08);
    }
    .row-low:hover {
      background: hsl(var(--destructive) / 0.08);
    }
    .row-actions {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
      align-items: center;
    }
    .btn {
      font-family: inherit;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: calc(var(--radius) - 4px);
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-receive {
      background: transparent;
      border: 1px solid hsl(var(--border));
      color: hsl(var(--foreground));
    }
    .btn-adjust {
      background: transparent;
      border: none;
      color: hsl(var(--muted-foreground));
    }
    .btn-adjust:hover { color: hsl(var(--foreground)); }
    .btn-request {
      background: transparent;
      border: 1px solid hsl(var(--border));
      color: hsl(var(--foreground));
    }
    .btn-more {
      background: transparent;
      border: none;
      color: hsl(var(--muted-foreground));
      font-size: 16px;
      padding: 4px 8px;
    }
    #pagination {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: hsl(var(--muted-foreground));
      border-top: 1px solid hsl(var(--border));
    }
    .btn-page {
      font-family: inherit;
      font-size: 12px;
      padding: 6px 10px;
      border: 1px solid hsl(var(--border));
      border-radius: calc(var(--radius) - 4px);
      background: transparent;
      color: hsl(var(--foreground));
      cursor: pointer;
    }
    .btn-page:disabled { opacity: 0.4; cursor: default; }
    .btn-page:not(:disabled):hover {
      background: hsl(var(--accent) / 0.1);
      border-color: hsl(var(--accent) / 0.4);
    }
    .page-controls { display: flex; gap: 8px; align-items: center; }
    .page-num { color: hsl(var(--muted-foreground)); }
    .empty {
      text-align: center;
      padding: 48px 16px;
      color: hsl(var(--muted-foreground));
    }
    .glow-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, hsl(var(--primary) / 0.5), hsl(var(--accent) / 0.5), transparent);
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <p class="era-label">Era 05 · Cyberpunk Current · 2026</p>
  <div class="page-wrap">
    <div id="app">
      <div class="page-header">
        <h2>Supplies</h2>
        <button type="button" class="btn-add">+ Add Supply</button>
      </div>
      <div id="summary"></div>
      <div id="toolbar"></div>
      <div class="glow-line"></div>
      <div class="table-shell">
        <table id="supplies-table">
          <thead>
            <tr>
              <th><button type="button" data-sort="name" class="sort-btn">Name <span class="sort-indicator">⇅</span></button></th>
              <th>Description</th>
              <th>Barcode</th>
              <th style="width:100px;text-align:right"><button type="button" data-sort="quantity" class="sort-btn">Quantity <span class="sort-indicator">⇅</span></button></th>
              <th style="width:100px;text-align:right"><button type="button" data-sort="minimumThreshold" class="sort-btn">Min. Threshold <span class="sort-indicator">⇅</span></button></th>
              <th style="width:280px;text-align:right">Actions</th>
            </tr>
          </thead>
          <tbody id="supplies-body"></tbody>
        </table>
        <div id="pagination"></div>
      </div>
    </div>
  </div>
  <script src="render.js"></script>
  <script>
    SuppliesHistory.init({
      era: "05-cyberpunk-current",
      theme: "cyberpunk",
      isAdmin: true,
      showStatus: false,
      showSummary: false,
    });
  </script>
</body>
</html>
