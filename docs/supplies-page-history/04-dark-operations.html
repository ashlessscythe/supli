<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, initial-scale=1" />
  <title>Supplies — Era 04 Dark Operations</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #e2e8f0;
      background: #0f1419;
    }
    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    .era-label {
      background: #1a2332;
      color: #64748b;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      padding: 5px 24px;
      border-bottom: 1px solid #1e293b;
    }
    .header {
      background: #151b24;
      border-bottom: 1px solid #1e293b;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .header .ops-badge {
      font-size: 11px;
      background: #1e3a5f;
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #0ea5e9;
    }
    .content { padding: 24px; flex: 1; }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .page-header h2 {
      margin: 0 0 4px;
      font-size: 26px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .page-header p { margin: 0; color: #64748b; font-size: 13px; }
    .btn-add {
      background: #0ea5e9;
      color: #0f1419;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #summary { margin-bottom: 20px; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .summary-card {
      background: #151b24;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 14px 16px;
      border-left: 3px solid #334155;
    }
    .summary-card:nth-child(3) { border-left-color: #f87171; }
    .summary-card:nth-child(2) { border-left-color: #4ade80; }
    .summary-label {
      display: block;
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .summary-value { font-size: 24px; font-weight: 700; color: #f1f5f9; }
    .summary-low { color: #f87171; }
    .summary-ok { color: #4ade80; }
    .panel {
      background: #151b24;
      border: 1px solid #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }
    .panel-head {
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #toolbar {
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #1e293b;
      background: #111820;
    }
    .search-input, .stock-filter {
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f1419;
      color: #e2e8f0;
    }
    .search-input { width: 340px; }
    .search-input::placeholder { color: #475569; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 11px 16px;
      text-align: left;
      border-bottom: 1px solid #1e293b;
    }
    th {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #111820;
    }
    .sort-btn {
      background: none;
      border: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .sort-active { color: #38bdf8; }
    .cell-name { font-weight: 600; color: #f1f5f9; }
    .cell-desc { color: #94a3b8; font-size: 13px; max-width: 280px; }
    .mono { font-family: ui-monospace, monospace; font-size: 12px; color: #64748b; }
    .qty-low { color: #f87171; font-weight: 700; }
    .row-low { background: rgb(248 113 113 / 0.06); }
    .row:hover { background: #1a2332; }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-low {
      background: rgb(248 113 113 / 0.15);
      color: #f87171;
      border: 1px solid rgb(248 113 113 / 0.3);
    }
    .badge-ok {
      background: rgb(74 222 128 / 0.1);
      color: #4ade80;
      border: 1px solid rgb(74 222 128 / 0.25);
    }
    .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
    .btn {
      font-family: inherit;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #334155;
      background: #1a2332;
      color: #cbd5e1;
    }
    .btn-receive { border-color: #0ea5e9; color: #38bdf8; }
    .btn-request { border-color: #475569; }
    .btn-more { padding: 5px 8px; }
    #pagination {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #64748b;
      background: #111820;
    }
    .btn-page {
      font-family: inherit;
      font-size: 11px;
      padding: 5px 12px;
      border: 1px solid #334155;
      border-radius: 4px;
      background: #1a2332;
      color: #cbd5e1;
      cursor: pointer;
    }
    .btn-page:disabled { opacity: 0.35; cursor: default; }
    .page-controls { display: flex; gap: 8px; align-items: center; }
    .empty { text-align: center; padding: 32px; color: #475569; }
  </style>
</head>
<body>
  <div class="shell">
    <p class="era-label">Era 04 · Dark Operations · 2025</p>
    <header class="header">
      <h1>Supli · Operations Console</h1>
      <span class="ops-badge">LIVE</span>
    </header>
    <div class="content">
      <div id="app">
        <div class="page-header">
          <div>
            <h2>Supplies</h2>
            <p>Inventory across all active locations</p>
          </div>
          <button type="button" class="btn-add">+ Add Supply</button>
        </div>
        <div id="summary"></div>
        <div class="panel">
          <div class="panel-head">Inventory Table</div>
          <div id="toolbar"></div>
          <table id="supplies-table">
            <thead>
              <tr>
                <th><button type="button" data-sort="name" class="sort-btn">Name <span class="sort-indicator">⇅</span></button></th>
                <th>Description</th>
                <th>Barcode</th>
                <th><button type="button" data-sort="quantity" class="sort-btn">Quantity <span class="sort-indicator">⇅</span></button></th>
                <th><button type="button" data-sort="minimumThreshold" class="sort-btn">Min. Threshold <span class="sort-indicator">⇅</span></button></th>
                <th>Status</th>
                <th style="text-align:right">Actions</th>
              </tr>
            </thead>
            <tbody id="supplies-body"></tbody>
          </table>
          <div id="pagination"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="render.js"></script>
  <script>
    SuppliesHistory.init({
      era: "04-dark-operations",
      theme: "dark",
      isAdmin: true,
      showStatus: true,
    });
  </script>
</body>
</html>
