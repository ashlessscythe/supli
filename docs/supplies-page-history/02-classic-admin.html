<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, initial-scale=1" />
  <title>Supplies — Era 02 Classic Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Verdana, sans-serif;
      font-size: 13px;
      color: #333;
      background: #e8e8e8;
    }
    #app { min-height: 100vh; }
    .era-label {
      background: #4a4a4a;
      color: #ccc;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 4px 16px;
    }
    .topbar {
      background: linear-gradient(#5c6bc0, #3f51b5);
      color: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar h1 { margin: 0; font-size: 18px; font-weight: normal; }
    .topbar .user { font-size: 12px; opacity: 0.9; }
    .content { padding: 16px 20px; }
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .page-header h2 { margin: 0; font-size: 20px; color: #222; }
    .btn-add {
      background: #3f51b5;
      color: #fff;
      border: 1px solid #303f9f;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
    }
    #summary { margin-bottom: 12px; }
    .summary-grid {
      display: flex;
      gap: 12px;
    }
    .summary-card {
      background: #fff;
      border: 1px solid #bbb;
      padding: 8px 14px;
      min-width: 100px;
    }
    .summary-label { display: block; font-size: 10px; color: #777; text-transform: uppercase; }
    .summary-value { font-size: 18px; font-weight: bold; color: #333; }
    .summary-low { color: #c62828; }
    .summary-ok { color: #2e7d32; }
    #toolbar {
      background: #fff;
      border: 1px solid #bbb;
      padding: 8px 10px;
      margin-bottom: 0;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .search-input, .stock-filter {
      font-family: inherit;
      font-size: 12px;
      padding: 5px 8px;
      border: 1px solid #999;
    }
    .search-input { width: 280px; }
    .table-wrap {
      background: #fff;
      border: 1px solid #bbb;
      border-top: none;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      border-bottom: 1px solid #ddd;
      padding: 8px 10px;
      text-align: left;
      vertical-align: middle;
    }
    th {
      background: #f5f5f5;
      font-size: 11px;
      text-transform: uppercase;
      color: #555;
      font-weight: bold;
    }
    .sort-btn {
      background: none;
      border: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
      padding: 0;
      text-transform: uppercase;
      font-size: 11px;
    }
    .sort-active { color: #3f51b5; }
    .mono { font-family: "Courier New", monospace; font-size: 11px; color: #666; }
    .qty-low { color: #c62828; font-weight: bold; }
    .row-low { background: #fff5f5; }
    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge-low { background: #ffcdd2; color: #b71c1c; border: 1px solid #e57373; }
    .badge-ok { background: #c8e6c9; color: #1b5e20; border: 1px solid #81c784; }
    .row-actions { display: flex; gap: 4px; flex-wrap: wrap; }
    .btn, .link-edit {
      font-family: inherit;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      text-decoration: none;
      color: #3f51b5;
    }
    .btn-request { background: #fff; border: 1px solid #3f51b5; color: #3f51b5; }
    .link-edit { border: none; background: none; }
    #pagination {
      background: #fff;
      border: 1px solid #bbb;
      border-top: none;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #666;
    }
    .btn-page {
      font-family: inherit;
      font-size: 11px;
      padding: 4px 10px;
      border: 1px solid #999;
      background: #f0f0f0;
      cursor: pointer;
    }
    .btn-page:disabled { opacity: 0.5; cursor: default; }
    .page-controls { display: flex; gap: 8px; align-items: center; }
    .empty { text-align: center; padding: 24px; color: #888; }
  </style>
</head>
<body>
  <div id="app">
    <p class="era-label">Era 02 · Classic Admin · 2021</p>
    <header class="topbar">
      <h1>Supli Admin</h1>
      <span class="user">carla · ADMIN</span>
    </header>
    <div class="content">
      <div class="page-header">
        <h2>Supplies</h2>
        <button type="button" class="btn-add">+ Add Supply</button>
      </div>
      <div id="summary"></div>
      <div id="toolbar"></div>
      <div class="table-wrap">
        <table id="supplies-table">
          <thead>
            <tr>
              <th><button type="button" data-sort="name" class="sort-btn">Name <span class="sort-indicator">⇅</span></button></th>
              <th>Description</th>
              <th>Barcode</th>
              <th><button type="button" data-sort="quantity" class="sort-btn">Qty <span class="sort-indicator">⇅</span></button></th>
              <th><button type="button" data-sort="minimumThreshold" class="sort-btn">Min <span class="sort-indicator">⇅</span></button></th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="supplies-body"></tbody>
        </table>
      </div>
      <div id="pagination"></div>
    </div>
  </div>
  <script src="render.js"></script>
  <script>
    SuppliesHistory.init({
      era: "02-classic-admin",
      theme: "classic",
      isAdmin: true,
      showStatus: true,
    });
  </script>
</body>
</html>
