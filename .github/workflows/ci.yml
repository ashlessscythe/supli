name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run test
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/supli?sslmode=disable"
          NEXTAUTH_SECRET: "ci-build-secret-minimum-32-characters-long"
          NEXTAUTH_URL: "http://localhost:3000"

      - run: npx tsc --noEmit

      - run: npx prisma generate

      - run: npm run build
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/supli?sslmode=disable"
          DATABASE_TEST_URL: "postgresql://user:password@localhost:5432/supli_test?sslmode=disable"
          NEXTAUTH_SECRET: "ci-build-secret-minimum-32-characters-long"
          NEXTAUTH_URL: "http://localhost:3000"
